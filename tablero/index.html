<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tablero · Ilusión Invites</title>
<link rel="icon" href="/img/ilusion-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F6EDE4; --paper: #FBF5EC; --ink: #3A2A26; --ink2: #6E5B54; --ink3: #9A877F; --gold: #B68A4E; --line: rgba(182,138,78,.3); --plum: #4B1535; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 Jost, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: rgba(246,237,228,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font: 500 26px 'Cormorant Garamond', serif; } header h1 em { color: var(--gold); }
  header .sp { flex: 1; }
  input, select, textarea, button { font: inherit; color: inherit; }
  #q { width: min(260px, 40vw); padding: 8px 14px; border-radius: 99px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: #fff; }
  .btn { border: 0; cursor: pointer; padding: 9px 18px; border-radius: 99px; font-weight: 500; color: #3A2210; background: linear-gradient(180deg, #F7E4B4, #D6A963); }
  .btn.ghost { background: #fff; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; padding: 16px 18px 40px; overflow-x: auto; min-height: calc(100vh - 64px); align-items: start; }
  .col { background: rgba(255,255,255,.45); border-radius: 18px; padding: 10px; box-shadow: inset 0 0 0 1px var(--line); }
  .col h2 { margin: 2px 6px 10px; display: flex; justify-content: space-between; font: 500 12px Jost; letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); }
  .col h2 b { color: var(--gold); }
  .card { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; margin-bottom: 8px; padding: 12px 14px; border-radius: 14px; background: var(--paper); box-shadow: 0 1px 0 var(--line), 0 8px 18px -14px rgba(60,35,25,.5); transition: transform .2s; }
  .card:hover { transform: translateY(-2px); }
  .card small { display: block; color: var(--ink3); font-size: 12px; letter-spacing: .08em; }
  .card b { display: block; font: 500 19px/1.2 'Cormorant Garamond', serif; margin: 2px 0; }
  .card span { font-size: 13px; color: var(--ink2); }
  .card .tag { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; background: #F3E6D2; color: #7A5A2E; }
  .empty { color: var(--ink3); font-size: 13px; text-align: center; padding: 14px 4px; }
  /* detail panel */
  .veil { position: fixed; inset: 0; background: rgba(40,25,20,.35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9; }
  .veil.on { opacity: 1; pointer-events: auto; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--paper); z-index: 10; transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1); overflow-y: auto; box-shadow: -20px 0 50px -20px rgba(60,35,25,.4); }
  aside.on { transform: none; }
  .dh { position: sticky; top: 0; background: var(--paper); padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: start; gap: 10px; z-index: 2; }
  .dh h3 { margin: 0; flex: 1; font: 500 26px/1.1 'Cormorant Garamond', serif; } .dh h3 small { display: block; font: 400 12px Jost; letter-spacing: .14em; color: var(--ink3); }
  .x { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--ink2); }
  .sec { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .sec h4 { margin: 0 0 8px; font: 500 11px Jost; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  dl { margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; } dt { color: var(--ink3); font-size: 13px; } dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .contact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .contact a { text-decoration: none; }
  .ph { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; } .ph a { display: block; aspect-ratio: 1; border-radius: 10px; background: #eee center / cover; }
  .f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .f label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink2); } .f .full { grid-column: 1 / -1; }
  .f input, .f select, .f textarea { padding: 9px 12px; border-radius: 10px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--line); width: 100%; }
  .f textarea { min-height: 70px; resize: vertical; }
  .f label.mail { flex-direction: row; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink2); margin-top: 4px; }
  .f .mail input { width: 18px; height: 18px; flex: none; padding: 0; box-shadow: none; accent-color: var(--gold); }
  .save { position: sticky; bottom: 0; padding: 14px 20px; background: var(--paper); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .save .msg { flex: 1; font-size: 13px; color: var(--ink2); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 30px); opacity: 0; transition: .3s; background: var(--plum); color: #F6EDE4; padding: 10px 18px; border-radius: 99px; z-index: 20; font-size: 14px; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) { header { flex-wrap: wrap; } #q { order: 3; width: 100%; } .board { grid-auto-columns: 84vw; scroll-snap-type: x mandatory; } .col { scroll-snap-align: start; } dl { grid-template-columns: 100px 1fr; } }
</style>
</head>
<body>
<header><h1>Tablero <em>Ilusión</em></h1><span class="sp"></span><input id="q" type="search" placeholder="Buscar nombre, pedido, evento…"><button class="btn ghost" id="reload">Actualizar</button></header>
<main class="board" id="board"><p class="empty">Cargando pedidos…</p></main>
<div class="veil" id="veil"></div>
<aside id="panel" aria-hidden="true"></aside>
<div id="toast" role="status"></div>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbwLSkVg670lTXk73S5B_zP-ay8Kpwj7xFRDBXJPta3QF27T_Jy1zRBG3t_n2oZhiuc/exec';
  // the private key comes in the link (#k=…) once, then this browser remembers it
  var KEY = '';
  try { var hk = /[#&]k=([\w-]+)/.exec(location.hash); if (hk) { KEY = hk[1]; localStorage.setItem('ilu-board-k', KEY); history.replaceState(null, '', location.pathname); } else KEY = localStorage.getItem('ilu-board-k') || ''; } catch (x) { var hk2 = /[#&]k=([\w-]+)/.exec(location.hash); KEY = hk2 ? hk2[1] : ''; }
  // no cookies are sent, so Google's "several accounts" problem never happens
  function api(accion, extra) {
    var body = { accion: accion, k: KEY }; for (var k in extra) body[k] = extra[k];
    return fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (r) { if (!r || !r.ok) throw new Error((r && r.error) || 'Sin respuesta'); return r; });
  }
  var D = { stages: [], orders: [] }, cur = null;
  var LABEL = { contacto: 'Contacto', correo: 'Correo', whatsapp: 'WhatsApp', idioma: 'Idioma', evento: 'Celebración', ambiente: 'Ambiente', idea: 'Tiene en mente', color: 'Sello / color', codigos: 'Códigos de color', incluir: 'Quiere incluir', extra: 'Algo más', quien_celebra: 'Quién celebra', fecha_evento: 'Fecha del evento', ciudad: 'Ciudad', sueno: 'Su sueño', recibido: 'Recibido' };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 2600); }
  function stageName(v) { for (var i = 0; i < D.stages.length; i++) if (D.stages[i][0] === v) return D.stages[i][1]; return v; }
  function load() {
    if (!KEY) { $('board').innerHTML = '<p class="empty">Abre el tablero con tu link privado.</p>'; return; }
    api('board').then(function (r) { D = r.data; render(); if (cur) { var o = find(cur.pedido); if (o) open(o); } }).catch(function (e) { $('board').innerHTML = '<p class="empty">No se pudo cargar: ' + esc(e.message) + '</p>'; });
  }
  function find(id) { for (var i = 0; i < D.orders.length; i++) if (D.orders[i].pedido === id) return D.orders[i]; return null; }
  function render() {
    var q = $('q').value.trim().toLowerCase();
    var list = D.orders.filter(function (o) { return !q || [o.pedido, o.contacto, o.evento, o.quien_celebra, o.ciudad, o.correo].join(' ').toLowerCase().indexOf(q) > -1; });
    $('board').innerHTML = D.stages.map(function (s) {
      var cards = list.filter(function (o) { return (o.etapa || 'consulta') === s[0]; }).sort(function (a, b) { return String(b.recibido).localeCompare(String(a.recibido)); });
      return '<section class="col"><h2>' + esc(s[1]) + ' <b>' + cards.length + '</b></h2>' + (cards.length ? cards.map(function (o) {
        var when = o.fecha_evento ? 'Evento ' + esc(o.fecha_evento) : 'Recibido ' + esc(String(o.recibido).slice(0, 10));
        return '<button class="card" data-id="' + esc(o.pedido) + '"><small>' + esc(o.pedido) + ' · ' + when + '</small><b>' + esc(o.quien_celebra || o.contacto) + '</b><span>' + esc(o.evento || '') + (o.ciudad ? ' · ' + esc(o.ciudad) : '') + '</span>' + (o.entrega_estimada ? '<br><span class="tag">Lista el ' + esc(o.entrega_estimada) + '</span>' : '') + '</button>';
      }).join('') : '<p class="empty">—</p>') + '</section>';
    }).join('');
  }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function open(o) {
    cur = o;
    var info = Object.keys(LABEL).filter(function (k) { return o[k] !== '' && o[k] != null; }).map(function (k) { return '<dt>' + LABEL[k] + '</dt><dd>' + esc(o[k]) + '</dd>'; }).join('');
    var opts = D.stages.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === (o.etapa || 'consulta') ? ' selected' : '') + '>' + esc(s[1]) + '</option>'; }).join('');
    var wa = digits(o.whatsapp);
    $('panel').innerHTML =
      '<div class="dh"><h3><small>' + esc(o.pedido) + ' · ' + esc(stageName(o.etapa)) + '</small>' + esc(o.quien_celebra || o.contacto) + '</h3><button class="x" id="close" aria-label="Cerrar">×</button></div>' +
      '<div class="sec"><h4>Lo que nos pidió</h4><dl>' + info + '</dl><div class="contact">' +
        (wa ? '<a class="btn ghost" target="_blank" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('Hola ' + String(o.contacto || '').split(' ')[0] + ', te escribe Ilusión Invites sobre tu pedido ' + o.pedido + ' ✨') + '">WhatsApp</a>' : '') +
        (o.correo ? '<a class="btn ghost" href="mailto:' + esc(o.correo) + '?subject=' + encodeURIComponent('Tu pedido ' + o.pedido + ' · Ilusión Invites') + '">Correo</a>' : '') +
        (o.carpeta ? '<a class="btn ghost" target="_blank" href="' + esc(o.carpeta) + '">Carpeta en Drive</a>' : '') + '</div></div>' +
      (o.fotos > 0 ? '<div class="sec"><h4>Fotos de inspiración (' + esc(o.fotos) + ')</h4><div class="ph" id="ph"><p class="empty">Cargando fotos…</p></div></div>' : '') +
      '<div class="sec"><h4>Seguimiento</h4><div class="f">' +
        '<label class="full">Etapa<select id="e-etapa">' + opts + '</select></label>' +
        '<label>Precio total<input id="e-precio" type="number" min="0" step="1" value="' + esc(o.precio) + '" placeholder="' + esc(o.moneda) + '"></label>' +
        '<label>Pagado<input id="e-pagado" type="number" min="0" step="1" value="' + esc(o.pagado) + '"></label>' +
        '<label>Lista para revisar el<input id="e-entrega_estimada" type="date" value="' + esc(o.entrega_estimada) + '"></label>' +
        '<label>Link de la invitación<input id="e-link" type="url" value="' + esc(o.link) + '" placeholder="https://"></label>' +
        '<label class="full">Notas (solo tú las ves)<textarea id="e-notas">' + esc(o.notas) + '</textarea></label>' +
        '<label class="full mail"><input type="checkbox" id="e-enviar" checked> Al cambiar de etapa, enviar el correo de esa etapa al cliente</label>' +
      '</div></div>' +
      (o.historial ? '<div class="sec"><h4>Historial</h4><dd>' + esc(o.historial) + '</dd></div>' : '') +
      '<div class="save"><span class="msg" id="smsg"></span><button class="btn" id="save">Guardar</button></div>';
    $('panel').classList.add('on'); $('veil').classList.add('on'); $('panel').setAttribute('aria-hidden', 'false');
    $('close').onclick = close; $('save').onclick = save;
    $('e-etapa').onchange = function () { var v = this.value; $('smsg').textContent = v !== o.etapa ? (o.correo ? 'Se enviará el correo de "' + stageName(v) + '" a ' + o.correo : 'Sin correo: no se enviará aviso') : ''; };
    if (o.fotos > 0) api('photos', { carpeta: o.carpeta }).then(function (r) { var el = $('ph'); if (el && cur === o) el.innerHTML = r.data.map(function (p) { return '<a target="_blank" rel="noopener" href="' + esc(p.url) + '" style="background-image:url(\'' + esc(p.thumb) + '\')" title="' + esc(p.name) + '"></a>'; }).join('') || '<p class="empty">Sin fotos</p>'; }).catch(function () { var el = $('ph'); if (el) el.innerHTML = '<p class="empty">No se pudieron cargar las fotos. Ábrelas en la carpeta de Drive.</p>'; });
  }
  function close() { $('panel').classList.remove('on'); $('veil').classList.remove('on'); $('panel').setAttribute('aria-hidden', 'true'); cur = null; }
  function save() {
    var o = cur, ch = { pedido: o.pedido, enviar: $('e-enviar').checked };
    ['etapa', 'precio', 'pagado', 'entrega_estimada', 'link', 'notas'].forEach(function (k) { ch[k] = $('e-' + k).value; });
    var b = $('save'); b.disabled = true; b.textContent = 'Guardando…';
    api('save', { row: o._row, cambios: ch }).then(function (r) { toast(r.sent ? 'Guardado · correo enviado ✉️' : 'Guardado'); b.disabled = false; b.textContent = 'Guardar'; load(); })
      .catch(function (e) { toast('No se pudo guardar: ' + e.message); b.disabled = false; b.textContent = 'Guardar'; });
  }
  $('board').addEventListener('click', function (e) { var c = e.target.closest('.card'); if (c) open(find(c.getAttribute('data-id'))); });
  $('veil').onclick = close;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  $('q').addEventListener('input', render);
  $('reload').onclick = load;
  load();
  setInterval(function () { if (!cur && !document.hidden) load(); }, 60000);
</script>
</body>
</html>

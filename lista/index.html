<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Confirmados · Ilusión Invites</title>
<link rel="icon" href="/img/ilusion-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The family's live guest list (paquete Ilusión). Opens with ?e=<evento>&k=<key>; the data comes from the order system. */
  :root { --bg: #F6EDE4; --paper: #FBF5EC; --ink: #3A2A26; --ink2: #6E5B54; --ink3: #8E7B73; --gold: #A87D43; --line: rgba(182,138,78,.32); --plum: #4B1535;
    --si: #1E6B3A; --si-bg: #E3F4E8; --no: #8A2B3A; --no-bg: #F8E3E6; --pen: #7A5A2E; --pen-bg: #F3E6D2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 Jost, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px 60px; }
  .eyebrow { margin: 0; text-align: center; font-size: 12px; letter-spacing: .3em; color: var(--gold); text-transform: uppercase; }
  h1 { margin: 4px 0 2px; text-align: center; font: 400 clamp(40px, 11vw, 56px)/1.1 'Pinyon Script', cursive; color: var(--plum); }
  .sub { margin: 0 0 22px; text-align: center; color: var(--ink2); font-size: 13.5px; }
  .tot { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
  .tot div { background: var(--paper); border-radius: 18px; padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line), 0 10px 22px -18px rgba(60,30,20,.5); }
  .tot b { display: block; font: 600 34px/1 'Cormorant Garamond', serif; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; margin-bottom: 6px; }
  .tot span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
  .tot .big { grid-column: 1 / -1; text-align: center; background: linear-gradient(180deg, #FFF8EC, #F7E9D3); }
  .tot .big b { font-size: 56px; color: var(--plum); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .chip { border: 0; cursor: pointer; padding: 8px 14px; border-radius: 99px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font: 500 13px Jost; color: var(--ink2); }
  .chip[aria-pressed="true"] { background: var(--plum); color: #fff; box-shadow: none; }
  .bar .sp { flex: 1; }
  .ref { border: 0; background: none; cursor: pointer; color: var(--gold); font: 500 13px Jost; padding: 8px 4px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 14px; padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); }
  li .who { flex: 1; min-width: 0; }
  li b { display: block; font: 600 19px/1.2 'Cormorant Garamond', serif; }
  li small { color: var(--ink3); font-size: 12.5px; }
  .pill { flex: none; padding: 4px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .pill.si { background: var(--si-bg); color: var(--si); } .pill.no { background: var(--no-bg); color: var(--no); } .pill.pen { background: var(--pen-bg); color: var(--pen); }
  .empty, .err { text-align: center; color: var(--ink3); padding: 30px 10px; }
  .foot { margin-top: 30px; text-align: center; font-size: 11px; letter-spacing: .26em; color: var(--ink3); text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Lista de confirmados</p>
  <h1 id="t">Tus invitados</h1>
  <p class="sub" id="upd">Cargando…</p>
  <div class="tot" id="tot" hidden>
    <div class="big"><b id="n-per">0</b><span>personas confirmadas</span></div>
    <div><b id="n-si">0</b><span>Invitaciones confirmadas</span></div>
    <div><b id="n-pen">0</b><span>Sin responder</span></div>
    <div><b id="n-no">0</b><span>No asistirán</span></div>
    <div><b id="n-lug">0</b><span>Lugares invitados</span></div>
  </div>
  <div class="bar" id="bar" hidden>
    <button class="chip" data-f="" aria-pressed="true">Todos</button>
    <button class="chip" data-f="si" aria-pressed="false">Confirmados</button>
    <button class="chip" data-f="pen" aria-pressed="false">Sin responder</button>
    <button class="chip" data-f="no" aria-pressed="false">No asistirán</button>
    <span class="sp"></span><button class="ref" id="ref" type="button">Actualizar ↻</button>
  </div>
  <ul id="list"></ul>
  <p class="foot">Hecho con ilusión · Ilusión Invites</p>
</main>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwLSkVg670lTXk73S5B_zP-ay8Kpwj7xFRDBXJPta3QF27T_Jy1zRBG3t_n2oZhiuc/exec';
  var q = new URLSearchParams(location.search), ev = q.get('e') || '', key = q.get('k') || '', rows = [], filt = '';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function st(r) { return r.asiste === 'si' ? 'si' : r.asiste === 'no' ? 'no' : 'pen'; }
  function render() {
    var shown = rows.filter(function (r) { return !filt || st(r) === filt; });
    $('list').innerHTML = shown.length ? shown.map(function (r) {
      var s = st(r), pill = s === 'si' ? 'Sí · ' + r.personas + (r.personas === 1 ? ' persona' : ' personas') : s === 'no' ? 'No asistirá' : 'Sin responder';
      return '<li><div class="who"><b>' + esc(r.n) + '</b><small>' + (r.l ? r.l + (r.l === 1 ? ' lugar' : ' lugares') : 'Invitado') + (r.fecha ? ' · respondió ' + esc(r.fecha) : '') + '</small></div><span class="pill ' + s + '">' + pill + '</span></li>';
    }).join('') : '<li class="empty">Nadie en esta lista todavía.</li>';
  }
  function load() {
    if (!ev || !key) { $('upd').textContent = 'Abre esta página con el link que te enviamos.'; return; }
    fetch(API, { method: 'POST', body: JSON.stringify({ lista: 1, evento: ev, k: key }), credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || 'Sin respuesta');
      rows = d.invitados.concat((d.extra || []).map(function (x) { x.l = 0; return x; }));
      var si = rows.filter(function (r) { return st(r) === 'si'; });
      $('t').textContent = d.titulo || 'Tus invitados'; document.title = 'Confirmados · ' + (d.titulo || 'Ilusión Invites');
      $('n-per').textContent = si.reduce(function (a, r) { return a + (r.personas || 0); }, 0);
      $('n-si').textContent = si.length;
      $('n-no').textContent = rows.filter(function (r) { return st(r) === 'no'; }).length;
      $('n-pen').textContent = rows.filter(function (r) { return st(r) === 'pen'; }).length;
      $('n-lug').textContent = d.invitados.reduce(function (a, r) { return a + (r.l || 0); }, 0);
      $('tot').hidden = false; $('bar').hidden = false;
      $('upd').textContent = 'Se actualiza solo · ' + new Date().toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
      render();
    }).catch(function (e) { $('upd').textContent = 'No se pudo cargar la lista (' + e.message + '). Revisa tu link.'; });
  }
  document.querySelectorAll('.chip').forEach(function (b) { b.addEventListener('click', function () { filt = b.dataset.f; document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); }); render(); }); });
  $('ref').addEventListener('click', load);
  load(); setInterval(function () { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>

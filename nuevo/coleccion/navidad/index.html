<style>
/* One collection "world": full-bleed hero that continues the portal from the home page, then the designs, then how to personalize, then the other worlds. Colours come from the collection's theme. */
:root {
  --bg: #14231C; --bg2: #0E1913; --ink: #F3E9D6; --accent: #D6B26E; --soft: #2A3B30;

  color-scheme: dark;
}
* { box-sizing: border-box; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
@view-transition { navigation: auto; }
/* arriving from the home portal: the page starts in the same warm light and clears softly */

@keyframes dreamIn { from { filter: blur(10px) brightness(1.15); transform: scale(1.06); } to { filter: none; transform: scale(1); } }

/* top bar */
.bar { position: fixed; z-index: 30; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); transition: background .4s, box-shadow .4s; }
.bar.solid { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

.hero-text { position: relative; z-index: 4; text-align: center; padding: 64px 22px 0; max-width: 860px; }

/* XV: gold flower letters for the initials, the rest in the serif */

@keyframes cue { 0%, 100% { transform: scaleY(.4); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } }
/* reveal */

.rv.in { opacity: 1; transform: none; }

button.phone { display: block; border: 0; cursor: pointer; font: inherit; color: inherit; }

.phone .play i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, #F7E4B4, #D6A963); box-shadow: 0 0 0 4px rgba(233,207,149,.35); animation: ping 2.4s ease-out infinite; }

  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 8px 20px -12px rgba(0,0,0,.35), 0 0 16px color-mix(in srgb, var(--accent) 30%, transparent) !important; }

        var a = b.el.animate(k, { duration: b.dur, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' });
        setTimeout(function () { b.img.style.animationDuration = '.32s'; }, b.dur * .86);
        a.onfinish = function () { b.landed = true; a.cancel(); b.el.style.opacity = 1; b.el.style.transform = tf(end[0], end[1], 0); b.img.className = 'rest'; b.img.style.animationDuration = ''; b.img.style.animationDelay = (-i * 3) + 's'; };
      }, b.delay);
    });
    function settle() { B.forEach(function (b, i) { if (b.landed) { var p = spot(b, i); b.el.style.transform = tf(p[0], p[1], 0); } }); }
    addEventListener('resize', settle);
    ['es', 'en'].forEach(function (id) { document.getElementById(id).addEventListener('click', function () { setTimeout(settle, 60); setTimeout(settle, 1300); }); });
  })();
  /* arrival: continue the portal from the home page, or a gentle intro when opened directly */
  var fromPortal = false; try { fromPortal = sessionStorage.getItem('ilu-portal') === C.slug; sessionStorage.removeItem('ilu-portal'); } catch (e) {}
  function revealHero(now) {
    var ht = document.getElementById('hero-text');
    var items = [].slice.call(ht.querySelectorAll('.mask-line, .rv'));
    var wait = fromPortal ? 650 : 250;
    items.forEach(function (el, i) { setTimeout(function () { el.classList.add('in'); }, now ? 0 : wait + i * 170); });
  }
  if (!fromPortal) document.querySelector('.hero-img').animate([{ transform: 'scale(1.12)', opacity: .2 }, { transform: 'scale(1)', opacity: 1 }], { duration: 1400, easing: 'cubic-bezier(.2,.7,.2,1)' });
  revealHero(false);

  /* bar turns solid after the hero */
  var bar = document.getElementById('bar');
  addEventListener('scroll', function () { bar.classList.toggle('solid', scrollY > innerHeight * .6); }, { passive: true });

  /* golden dust */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, cv = document.getElementById('dust'), ctx = cv.getContext('2d'), W = 0, H = 0, P = [], last = 0;
  function size() { var d = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); P = []; for (var i = 0; i < (W < 700 ? 26 : 50); i++) P.push({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.6, vy: -(4 + Math.random() * 9), ph: Math.random() * 6.3, sp: .6 + Math.random() * 1.4 }); }
  function draw(t) { var dt = Math.min(.05, (t - (last || t)) / 1000); last = t; ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) { var p = P[i]; p.ph += dt * p.sp; p.y += p.vy * dt; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } ctx.fillStyle = 'rgba(242,214,158,' + (.25 + .6 * Math.abs(Math.sin(p.ph))) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    if (scrollY < innerHeight) requestAnimationFrame(draw); else { last = 0; waiting = true; } }
  var waiting = false;
  addEventListener('scroll', function () { if (waiting && scrollY < innerHeight && !reduce) { waiting = false; requestAnimationFrame(draw); } }, { passive: true });
  size(); addEventListener('resize', size); if (!reduce) requestAnimationFrame(draw);
  addEventListener('pageshow', function (e) { if (e.persisted) revealHero(true); });
})();

<style>
/* One collection "world": full-bleed hero that continues the portal from the home page, then the designs, then how to personalize, then the other worlds. Colours come from the collection's theme. */
:root {
  --bg: #0F1016; --bg2: #07080C; --ink: #F2EBDD; --accent: #D2B27A; --soft: #22232C;
  --ink2: color-mix(in srgb, var(--ink) 72%, var(--bg)); --ink3: color-mix(in srgb, var(--ink) 50%, var(--bg));
  --foil: linear-gradient(100deg, #9C7038 0%, #E9CF95 24%, #C29452 46%, #F3DFA9 64%, #B68A4E 82%, #E2C489 100%);
  --f-caps: "Cinzel", Georgia, serif; --f-serif: "Cormorant Garamond", Georgia, serif; --f-script: "Great Vibes", cursive; --f-body: "Jost", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
@view-transition { navigation: auto; }
/* arriving from the home portal: the page starts in the same warm light and clears softly */
html.arrive body::after { content: ""; position: fixed; inset: 0; z-index: 200; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,250,238,1) 0%, rgba(255,244,222,.92) 38%, rgba(251,240,220,.85) 100%); animation: lightOut 1.3s cubic-bezier(.4,0,.2,1) .05s forwards; }
@keyframes lightOut { to { opacity: 0; visibility: hidden; } }
html.arrive .hero-img { animation: dreamIn 2s cubic-bezier(.2,.7,.2,1) both, slowzoom 22s ease-in-out 2s infinite alternate; }
@keyframes dreamIn { from { filter: blur(10px) brightness(1.15); transform: scale(1.06); } to { filter: none; transform: scale(1); } }

/* top bar */
.bar { position: fixed; z-index: 30; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); transition: background .4s, box-shadow .4s; }
.bar.solid { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.back { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 500 12px var(--f-caps); letter-spacing: .24em; color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.45); }
.bar.solid .back { color: var(--ink); text-shadow: none; }
.back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand img { width: 38px; height: auto; filter: drop-shadow(0 3px 5px rgba(0,0,0,.25)); }
.brand b { font: 400 26px/1.1 var(--f-script); color: #D2AA6A; padding: 0 .08em 0 .16em; text-shadow: 0 1px 2px rgba(50,30,10,.55), 0 0 16px rgba(40,25,10,.45); }
.bar.solid .brand b { color: #A87B3F; text-shadow: none; }
.lang { display: flex; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.12); }
.bar.solid .lang { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: transparent; }
.lang button { border: 0; background: none; padding: 6px 12px; font: 500 12px var(--f-body); color: #fff; cursor: pointer; }
.bar.solid .lang button { color: var(--ink2); }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff !important; }
@media (max-width: 560px) { .brand b { display: none; } .back span { display: none; } }

/* hero */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 45%; animation: slowzoom 22s ease-in-out infinite alternate; }
@keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.08); } }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, color-mix(in srgb, var(--bg) 55%, transparent) 78%, var(--bg) 100%); pointer-events: none; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.hero .deco { position: absolute; z-index: 3; height: auto; pointer-events: none; filter: drop-shadow(0 18px 22px rgba(0,0,0,.3)); animation: drift 7s ease-in-out infinite alternate; }
@keyframes drift { from { translate: 0 0; } to { translate: 0 -12px; } }
.hero .deco { -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%); mask-image: radial-gradient(closest-side, #000 62%, transparent 100%); }
.hero .deco.d1 { width: clamp(140px, 18vw, 280px); left: -3%; top: 16%; }
.hero .deco.d2 { width: clamp(120px, 14vw, 220px); right: -2%; bottom: 26%; transform: scaleX(-1); }
.hero-text::before { content: ""; position: absolute; left: 50%; top: 52%; width: 140%; height: 120%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--bg) 90%, transparent), color-mix(in srgb, var(--bg) 66%, transparent) 55%, color-mix(in srgb, var(--bg) 20%, transparent) 85%, transparent); z-index: -1; pointer-events: none; }
.hero-text { position: relative; z-index: 4; text-align: center; padding: 64px 22px 0; max-width: 860px; }
.hero-text .eyebrow { font: 600 12.5px var(--f-caps); letter-spacing: .5em; padding-left: .5em; color: color-mix(in srgb, var(--accent) 80%, var(--ink)); }
.hero-text h1 { margin: 8px 0 0; font: 500 clamp(52px, 9vw, 116px)/1 var(--f-serif); color: var(--ink); text-wrap: balance; }
.hero-text .script { display: block; margin-top: 2px; font: 400 clamp(30px, 3.6vw, 48px)/1.25 var(--f-script); padding-bottom: .1em; }
.hero-text .script > span { background: linear-gradient(100deg, #7A5022 0%, #B9873F 28%, #8A5C26 50%, #C99A52 72%, #80552A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .15em; filter: drop-shadow(0 1px 0 rgba(255,250,240,.6)) drop-shadow(0 3px 10px rgba(70,30,40,.3)); }
.oscuro .hero-text .script > span { background: var(--foil); -webkit-background-clip: text; background-clip: text; filter: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* gold title (XV): solid polished gold, like the gold letters but clean */
.titulo-oro .hero-text h1 { font-weight: 600; letter-spacing: .01em; background: linear-gradient(180deg, #FCF0C8 0%, #EDCB82 20%, #C79747 42%, #8E5F24 54%, #C9994F 66%, #F2D99A 84%, #B2803A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(110,72,28,.85)) drop-shadow(0 2px 1px rgba(90,55,20,.35)) drop-shadow(0 10px 16px rgba(70,30,40,.25)); padding: 0 .06em .06em; }
/* magic sparkle reveal (XV): a gold wand trail sweeps over the title and reveals it */
#magic { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
.magic-on .hero-text h1.mask-line > span { transform: none !important; transition: none !important; }
.magic-hide { -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--rv, -100px) - 90px), transparent var(--rv, -100px)); mask-image: linear-gradient(90deg, #000 calc(var(--rv, -100px) - 90px), transparent var(--rv, -100px)); }
.hero-text p { margin: 14px auto 0; max-width: 54ch; color: var(--ink2); font-size: clamp(16px, 1.6vw, 18.5px); }
.cue { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 26px; font: 500 10.5px var(--f-caps); letter-spacing: .34em; color: var(--ink3); text-decoration: none; }
.cue i { width: 1px; height: 34px; background: linear-gradient(var(--accent), transparent); animation: cue 2.2s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: scaleY(.4); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } }
/* reveal */
.rv { opacity: 0; transform: translateY(26px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
.rv.in { opacity: 1; transform: none; }
.mask-line { display: block; overflow: hidden; }
.mask-line > span { display: inline-block; transform: translateY(105%); transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.in .mask-line > span, .mask-line.in > span { transform: none; }

/* designs */
.sec { padding-block: clamp(70px, 10vw, 120px); }
.head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: clamp(36px, 5vw, 60px); }
.head .eyebrow { font: 500 12px var(--f-caps); letter-spacing: .42em; color: var(--accent); }
.head h2 { margin: 0; font: 500 clamp(34px, 4.6vw, 56px)/1.08 var(--f-serif); text-wrap: balance; }
.head h2 em { font-style: italic; }
.head p { margin: 0; color: var(--ink2); max-width: 56ch; }
.designs { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(30px, 5vw, 70px); }
.design { width: min(300px, 80vw); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.design:nth-child(2) { margin-top: clamp(0px, 5vw, 60px); }
.phone { position: relative; width: 100%; aspect-ratio: 1 / 2; border-radius: 34px; padding: 9px; background: linear-gradient(145deg, #3b3236, #121012 40%, #2a2326 70%, #0d0b0c); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 40px 60px -26px rgba(40,25,20,.6), 0 14px 22px rgba(40,25,20,.25); transition: transform .8s cubic-bezier(.2,.7,.2,1); animation: float 6s ease-in-out infinite alternate; }
.design:nth-child(2) .phone { animation-delay: -2s; } .design:nth-child(3) .phone { animation-delay: -4s; }
@keyframes float { from { translate: 0 0; } to { translate: 0 -10px; } }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 26px; display: block; }
.phone::after { content: ""; position: absolute; inset: 9px; border-radius: 26px; background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 34%); pointer-events: none; }
.design:hover .phone { transform: rotate(-2deg) translateY(-6px); }
.design h3 { margin: 12px 0 0; font: 500 28px/1.1 var(--f-serif); }
.design .who { font: italic 500 17px var(--f-serif); color: var(--ink2); margin-top: -6px; }
.design .note { margin: 0; font-size: 14.5px; color: var(--ink2); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font: 500 14px var(--f-body); letter-spacing: .04em; text-decoration: none; border: 1px solid transparent; transition: transform .2s, filter .2s; }
.btn:hover { transform: translateY(-1px); }
.btn-gold { background: linear-gradient(180deg, #E9CF95, #C29452 60%, #A8783E); color: #fff; text-shadow: 0 1px 1px rgba(90,60,20,.35); box-shadow: 0 10px 22px -10px rgba(150,105,50,.6); }
.btn-line { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--ink); }
.soon { max-width: 640px; margin: 0 auto; text-align: center; padding: clamp(30px, 5vw, 52px); border-radius: 14px; background: radial-gradient(ellipse 62% 68% at 50% 48%, color-mix(in srgb, var(--soft) 75%, transparent), transparent 100%); }
.soon h3 { margin: 0 0 8px; font: 500 30px var(--f-serif); }
.soon p { margin: 0 0 20px; color: var(--ink2); }

/* live preview: the invitation plays inside a phone, without leaving the page */
button.phone { display: block; border: 0; cursor: pointer; font: inherit; color: inherit; }
.phone .play { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); z-index: 2; display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px 9px 10px; border-radius: 999px; white-space: nowrap; background: rgba(255,252,246,.86); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 10px 22px -10px rgba(40,25,20,.55), inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); font: 500 10px var(--f-caps); letter-spacing: .2em; color: #3A2A26; transition: transform .4s, box-shadow .4s; }
.phone .play i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, #F7E4B4, #D6A963); box-shadow: 0 0 0 4px rgba(233,207,149,.35); animation: ping 2.4s ease-out infinite; }
.phone .play i::after { content: ""; margin-left: 3px; border-left: 8px solid #3A2210; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(233,207,149,.6); } 100% { box-shadow: 0 0 0 12px rgba(233,207,149,0); } }
.design:hover .phone .play { transform: translateX(-50%) scale(1.05); }
.pv { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; }
.pv-bg { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 70%, rgba(30,20,15,.35)); -webkit-backdrop-filter: blur(16px) saturate(1.1); backdrop-filter: blur(16px) saturate(1.1); animation: pvFade .5s ease both; }
.pv-in { position: relative; display: flex; align-items: center; gap: clamp(28px, 5vw, 64px); animation: pvIn .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pvFade { from { opacity: 0; } }
@keyframes pvIn { from { opacity: 0; transform: translateY(24px) scale(.94); filter: blur(4px); } }
.pv.out .pv-bg { animation: pvFade .35s ease reverse forwards; } .pv.out .pv-in { animation: pvIn .35s ease reverse forwards; }
.pv-phone { position: relative; border-radius: 40px; padding: 10px; background: linear-gradient(145deg, #3b3236, #121012 40%, #2a2326 70%, #0d0b0c); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 60px 90px -40px rgba(40,25,20,.7), 0 0 60px color-mix(in srgb, var(--accent) 25%, transparent); }
.pv-screen { position: relative; overflow: hidden; border-radius: 31px; background: #fff; }
.pv-screen iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
.pv-side { width: min(320px, 34vw); display: flex; flex-direction: column; gap: 12px; color: var(--ink); }
.pv-side .eyebrow { font: 500 11px var(--f-caps); letter-spacing: .4em; color: var(--accent); }
.pv-side h3 { margin: 0; font: 500 clamp(34px, 3.6vw, 46px)/1.05 var(--f-serif); }
.pv-side .who { font: italic 500 19px var(--f-serif); color: var(--ink2); }
.pv-side p { margin: 0; color: var(--ink2); font-size: 15px; }
.pv-side .tip { display: flex; align-items: center; gap: 10px; font: 500 10.5px var(--f-caps); letter-spacing: .2em; color: var(--ink3); }
.pv-side .tip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: ping 2s ease-out infinite; }
.pv-side .btns { justify-content: flex-start; flex-direction: column; align-items: stretch; margin-top: 8px; }
.pv-x { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; z-index: 3; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: rgba(255,252,246,.9); box-shadow: 0 8px 20px -8px rgba(40,25,20,.5), inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); color: #3A2A26; }
.pv-x svg { width: 18px; height: 18px; }
.pv-bar { display: none; }
@media (max-width: 700px) {
  .pv { padding: 0; place-items: stretch; }
  .pv-in { flex-direction: column; align-items: stretch; gap: 0; width: 100%; height: 100%; }
  .pv-x { right: auto; left: 12px; top: max(12px, env(safe-area-inset-top, 0px)); width: 42px; height: 42px; }
  .pv-phone { flex: 1; width: 100%; border-radius: 0; padding: 0; background: #fff; box-shadow: none; }

  .pv-bar { display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 92%, #fff); box-shadow: 0 -1px 0 color-mix(in srgb, var(--accent) 30%, transparent); }
  .pv-bar .btn { flex: 1; padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) { .pv-bg, .pv-in, .phone .play i, .pv-side .tip i { animation: none; } }
.cta-row { display: flex; justify-content: center; margin-top: clamp(28px, 4vw, 44px); }

/* themed page (XV): the hero's soft bokeh continues behind every section, with crystals falling like snow */
.after-hero { position: relative; }
.after-hero > section { position: relative; z-index: 1; }
.page-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 40vh, #000 calc(100% - 26vh), transparent); mask-image: linear-gradient(180deg, transparent 0, #000 40vh, #000 calc(100% - 26vh), transparent); }
.page-view { position: sticky; top: 0; height: 100vh; height: 100lvh; overflow: hidden; }
.pb-img { position: absolute; inset: -12%; background: center / cover no-repeat; filter: blur(22px) saturate(1.15); opacity: .7; animation: pbDrift 46s ease-in-out infinite alternate; }
@keyframes pbDrift { from { transform: scale(1.08) translate3d(-2%, -1%, 0); } to { transform: scale(1.16) translate3d(2%, 1.5%, 0); } }
.page-view::after { content: ""; position: absolute; inset: 0; background: radial-gradient(64% 58% at 50% 50%, color-mix(in srgb, var(--bg) 72%, transparent), color-mix(in srgb, var(--bg) 28%, transparent) 75%, color-mix(in srgb, var(--bg) 10%, transparent)); }
#rain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .pb-img { animation: none; } }
.sec-foto::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--foto) center / cover no-repeat; opacity: .5; -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent); }
.sec-foto::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(60% 70% at 50% 50%, color-mix(in srgb, var(--bg) 78%, transparent), color-mix(in srgb, var(--bg) 30%, transparent)); -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent); }
.sec-foto { isolation: isolate; }
/* example invitations (until the real ones are ready) */
.ej-note { text-align: center; margin: -18px auto 34px; max-width: 52ch; color: var(--ink2); font-size: 15px; }

.ej-scr::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 30%, color-mix(in srgb, var(--bg) 78%, transparent) 62%, color-mix(in srgb, var(--bg) 92%, transparent)); }

.ej-eye { font: 500 9.5px var(--f-caps); letter-spacing: .36em; padding-left: .36em; }
.ej-name { font: 400 clamp(38px, 4vw, 48px)/1.05 var(--f-script); background: linear-gradient(180deg, #F3D99A, #C79747 50%, #8E5F24); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .12em .08em; filter: drop-shadow(0 1px 0 rgba(255,250,240,.5)); }
.ej-scr.dark .ej-name { background: linear-gradient(180deg, #FCF0C8, #EDCB82 45%, #C79747); -webkit-background-clip: text; background-clip: text; filter: none; }
.ej-rule { width: 46%; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 4px 0; }
.ej-scr.dark .ej-rule { background: linear-gradient(90deg, transparent, #E9CF95, transparent); }

/* "make your event complete": invites people to the experience page */
.mas-in { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 70px); align-items: center; }
.mas-txt { display: flex; flex-direction: column; gap: 12px; }
.mas-txt .eyebrow { font: 500 12px var(--f-caps); letter-spacing: .42em; color: var(--accent); }
.mas-txt h2 { margin: 0; font: 500 clamp(34px, 4.4vw, 54px)/1.08 var(--f-serif); }
.mas-txt h2 em { font-style: italic; }
.mas-txt p { margin: 0; color: var(--ink2); }
.mas-list { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.mas-list li { position: relative; padding-left: 18px; font-size: 15px; color: var(--ink2); }
.mas-list li::before { content: ""; position: absolute; left: 1px; top: .55em; width: 6px; height: 6px; transform: rotate(45deg); background: var(--accent); }
.mas-vis { position: relative; display: block; aspect-ratio: 1.15; }
.mv { position: absolute; overflow: hidden; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 40px 60px -34px rgba(40,25,20,.55); background: var(--bg2); transition: transform .8s cubic-bezier(.2,.7,.2,1); }
.mv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mv1 { left: 0; top: 4%; width: 46%; height: 88%; border-radius: 50% 50% 16px 16px / 26% 26% 16px 16px; z-index: 2; }
.mv2 { right: 2%; top: 0; width: 50%; height: 54%; border-radius: 18px; }
.mv3 { right: 10%; bottom: 0; width: 34%; height: 50%; border-radius: 24px; z-index: 3; box-shadow: 0 0 0 6px #1b1418, 0 40px 60px -30px rgba(40,25,20,.6); }
.mas-vis:hover .mv1 { transform: translateY(-6px) rotate(-1deg); } .mas-vis:hover .mv3 { transform: translateY(-6px) rotate(2deg); }
@media (max-width: 860px) { .mas-in { grid-template-columns: minmax(0, 1fr); } .mas-vis { order: -1; max-width: 520px; width: 100%; margin: 0 auto; } }
@media (max-width: 520px) { .mas-list { grid-template-columns: 1fr; } }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 3vw, 40px); }
@media (max-width: 820px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.step { text-align: center; padding: 10px; }
.step .n { font: italic 500 52px/1 var(--f-serif); background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }
.step h3 { margin: 8px 0 4px; font: 500 24px var(--f-serif); }
.step p { margin: 0; color: var(--ink2); font-size: 15px; }

.others { display: flex; overflow-x: auto; padding: 10px 0 26px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); }

          var a = .25 + .3 * tw; x.strokeStyle = 'rgba(' + p.c + ',' + a + ')'; x.lineWidth = 1; x.beginPath(); x.arc(px, p.y, p.s, 0, 6.283); x.stroke();
          glow(px, p.y, p.s, p.c, a * .35); glow(px - p.s * .35, p.y - p.s * .4, p.s * .35, '255,255,255', .8 * tw);
        } else if (KIND === 'nieve') {
          glow(px, p.y, p.s * 2.4, p.c, .9 * (.6 + .4 * tw)); if (p.glint && tw > .9) star(px, p.y, 7, (tw - .9) * 7);
        } else if (KIND === 'champana' && p.up) {
          x.strokeStyle = 'rgba(' + p.c + ',' + (.45 + .4 * tw) + ')'; x.lineWidth = .8; x.beginPath(); x.arc(px, p.y, p.s, 0, 6.283); x.stroke(); glow(px - p.s * .3, p.y - p.s * .3, p.s * .6, '255,255,255', .7);
        } else {
          glow(px, p.y, p.s * 3, p.c, .85 * tw); if (tw > .93) star(px, p.y, p.s * 4, (tw - .93) * 9);
        }

    }
    size(); addEventListener('resize', size);
    if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { var v = es[0].isIntersecting; if (v && !run) { run = true; last = 0; requestAnimationFrame(draw); } else if (!v) run = false; }).observe(wrap);
  })();
  /* arrival: continue the portal from the home page, or a gentle intro when opened directly */
  var fromPortal = false; try { fromPortal = sessionStorage.getItem('ilu-portal') === C.slug; sessionStorage.removeItem('ilu-portal'); } catch (e) {}
  function revealHero(now) {
    var ht = document.getElementById('hero-text');
    var items = [].slice.call(ht.querySelectorAll('.mask-line, .rv'));
    var wait = fromPortal ? 650 : 250;
    if (MAGIC && !now) { /* eyebrow first, the wand reveals the title, then the rest follows */
      items.forEach(function (el, i) { setTimeout(function () { el.classList.add('in'); }, i === 0 ? wait : wait + 2300 + i * 170); });
      startMagic(wait + 250); return;
    }
    items.forEach(function (el, i) { setTimeout(function () { el.classList.add('in'); }, now ? 0 : wait + i * 170); });
  }
  if (!fromPortal) document.querySelector('.hero-img').animate([{ transform: 'scale(1.12)', opacity: .2 }, { transform: 'scale(1)', opacity: 1 }], { duration: 1400, easing: 'cubic-bezier(.2,.7,.2,1)' });
  revealHero(false);

  /* bar turns solid after the hero */
  var bar = document.getElementById('bar');
  addEventListener('scroll', function () { bar.classList.toggle('solid', scrollY > innerHeight * .6); }, { passive: true });

  /* golden dust */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, cv = document.getElementById('dust'), ctx = cv.getContext('2d'), W = 0, H = 0, P = [], last = 0;
  function size() { var d = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); P = []; for (var i = 0; i < (W < 700 ? 26 : 50); i++) P.push({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.6, vy: -(4 + Math.random() * 9), ph: Math.random() * 6.3, sp: .6 + Math.random() * 1.4 }); }
  function draw(t) { var dt = Math.min(.05, (t - (last || t)) / 1000); last = t; ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) { var p = P[i]; p.ph += dt * p.sp; p.y += p.vy * dt; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } ctx.fillStyle = 'rgba(242,214,158,' + (.25 + .6 * Math.abs(Math.sin(p.ph))) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    if (scrollY < innerHeight) requestAnimationFrame(draw); else { last = 0; waiting = true; } }
  var waiting = false;
  addEventListener('scroll', function () { if (waiting && scrollY < innerHeight && !reduce) { waiting = false; requestAnimationFrame(draw); } }, { passive: true });
  size(); addEventListener('resize', size); if (!reduce) requestAnimationFrame(draw);
  addEventListener('pageshow', function (e) { if (e.persisted) revealHero(true); });
})();

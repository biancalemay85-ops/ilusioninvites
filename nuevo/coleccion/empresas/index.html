.back { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 500 12px var(--f-caps); letter-spacing: .24em; color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.45); }

.bar.solid .lang { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: transparent; }
.lang button { border: 0; background: none; padding: 6px 12px; font: 500 12px var(--f-body); color: #fff; cursor: pointer; }
.bar.solid .lang button { color: var(--ink2); }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff !important; }

.hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 45%; animation: slowzoom 22s ease-in-out infinite alternate; }

.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.hero .deco { position: absolute; z-index: 3; height: auto; pointer-events: none; filter: drop-shadow(0 18px 22px rgba(0,0,0,.3)); animation: drift 7s ease-in-out infinite alternate; }

.hero .deco { -webkit-mask-image: linear-gradient(150deg, transparent 3%, #000 24%); mask-image: linear-gradient(150deg, transparent 3%, #000 24%); }
.hero .deco.d1 { width: clamp(140px, 18vw, 280px); left: -3%; top: 16%; }
.hero .deco.d2 { width: clamp(120px, 14vw, 220px); right: -2%; bottom: 26%; transform: scaleX(-1); }
.hero-text::before { content: ""; position: absolute; left: 50%; top: 55%; width: 140%; height: 120%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--bg) 82%, transparent), color-mix(in srgb, var(--bg) 40%, transparent) 60%, transparent); z-index: -1; pointer-events: none; }

.hero-text h1 { margin: 8px 0 0; font: 500 clamp(52px, 9vw, 116px)/1 var(--f-serif); color: var(--ink); text-wrap: balance; }
.hero-text .script { display: block; margin-top: 2px; font: 400 clamp(30px, 3.6vw, 48px)/1.25 var(--f-script); padding-bottom: .1em; }
.hero-text .script > span { background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .15em; }

.rv.in { opacity: 1; transform: none; }

.head .eyebrow { font: 500 12px var(--f-caps); letter-spacing: .42em; color: var(--accent); }

.head h2 em { font-style: italic; }
.head p { margin: 0; color: var(--ink2); max-width: 56ch; }
.designs { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(30px, 5vw, 70px); }
.design { width: min(300px, 80vw); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }

.design:nth-child(2) .phone { animation-delay: -2s; } .design:nth-child(3) .phone { animation-delay: -4s; }

.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 26px; display: block; }

.design:hover .phone { transform: rotate(-2deg) translateY(-6px); }
.design h3 { margin: 12px 0 0; font: 500 28px/1.1 var(--f-serif); }
.design .who { font: italic 500 17px var(--f-serif); color: var(--ink2); margin-top: -6px; }
.design .note { margin: 0; font-size: 14.5px; color: var(--ink2); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font: 500 14px var(--f-body); letter-spacing: .04em; text-decoration: none; border: 1px solid transparent; transition: transform .2s, filter .2s; }

      verInv: 'View invitation', personalizar: 'Personalize', soonT: 'This collection is being created', soonP: 'We are designing the first invitations for this world. In the meantime, we will create yours just for you.',
      soonBtn: 'Request my invitation', formBtn: 'Fill in the form',
      pasos: [['Choose your design', 'Pick the one you love or tell us your idea.'], ['Tell us the details', 'Names, date, venue, photos and music. It takes minutes.'], ['Receive it and share it', 'Your link with envelope, music, map and RSVP, ready to send.']],
      msgDis: function (d) { return 'Hi Ilusión Invites ✨ I love the "' + d + '" design from the ' + C.en.nombre + ' collection. Can you help me personalize it?'; },
      msgCol: function () { return 'Hi Ilusión Invites ✨ I am interested in an invitation from the ' + C.en.nombre + ' collection.'; } }
  };
  var lang = 'es';
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render() {
    var L = T[lang], t = C[lang] || C.es;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = L[el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = L[el.getAttribute('data-i18n-html')]; });
    document.getElementById('h-nombre').textContent = t.nombre;
    document.getElementById('h-script').textContent = t.script;
    document.getElementById('h-intro').textContent = t.intro;
    document.title = t.nombre + ' · Ilusión Invites';
    var box = document.getElementById('designs');
    if (C.disenos && C.disenos.length) {
      box.className = 'designs';
      box.innerHTML = C.disenos.map(function (d, i) {
        return '<article class="design rv" style="transition-delay:' + (i * .18) + 's"><div class="phone"><img src="../../img/' + d.poster + '" alt="' + esc(d.nombre) + '" width="520" height="1040" loading="lazy"></div>' +
          '<h3>' + esc(d.nombre) + '</h3><span class="who">' + esc(d.pareja) + '</span><p class="note">' + esc(d.nota) + '</p>' +
          '<div class="btns"><a class="btn btn-line" href="' + d.url + '" target="_blank" rel="noopener">' + L.verInv + '</a><a class="btn btn-gold" href="' + WA + encodeURIComponent(L.msgDis(d.nombre)) + '" target="_blank" rel="noopener">' + L.personalizar + '</a></div></article>';
      }).join('');
    } else {
      box.className = '';
      box.innerHTML = '<div class="soon rv"><h3>' + L.soonT + '</h3><p>' + L.soonP + '</p><div class="btns">' + (C.form ? '<a class="btn btn-gold" href="' + C.form + '">' + L.formBtn + '</a>' : '') +
        '<a class="btn ' + (C.form ? 'btn-line' : 'btn-gold') + '" href="' + WA + encodeURIComponent(L.msgCol()) + '" target="_blank" rel="noopener">' + L.soonBtn + '</a></div></div>';
    }
    document.getElementById('steps').innerHTML = L.pasos.map(function (p, i) { return '<div class="step rv" style="transition-delay:' + (i * .15) + 's"><div class="n">' + (i + 1) + '</div><h3>' + p[0] + '</h3><p>' + p[1] + '</p></div>'; }).join('');
    document.getElementById('others').innerHTML = ALL.filter(function (o) { return o.slug !== C.slug; }).map(function (o) {
      var m = 'url(../../img/ventana-' + o.frame + '.png)';
      return '<a class="other" href="../' + o.slug + '/"><div class="fb" style="--ar:' + FR[o.frame] + '"><div class="win" style="-webkit-mask-image:' + m + ';mask-image:' + m + '"><img src="../../img/' + o.img + '.webp" alt="" loading="lazy"></div><img class="fr" src="../../img/marco-' + o.frame + '.webp" alt="" loading="lazy"></div><b>' + esc((o[lang] || o.es).nombre) + '</b></a>';
    }).join('');
    document.getElementById('es').setAttribute('aria-pressed', String(lang === 'es'));
    document.getElementById('en').setAttribute('aria-pressed', String(lang === 'en'));
    observe();
  }
  /* reveals */
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .15 }) : null;
  function observe() { document.querySelectorAll('.rv:not(.in)').forEach(function (el) { if (io && !el.closest('.hero')) io.observe(el); }); }
  function setLang(l) { lang = l; try { localStorage.setItem('ilu-lang', l); } catch (e) {} render(); revealHero(true); }
  document.getElementById('es').addEventListener('click', function () { setLang('es'); });
  document.getElementById('en').addEventListener('click', function () { setLang('en'); });
  try { if (localStorage.getItem('ilu-lang') === 'en') lang = 'en'; } catch (e) {}
  render();

  /* arrival: continue the portal from the home page, or a gentle intro when opened directly */
  var fromPortal = false; try { fromPortal = sessionStorage.getItem('ilu-portal') === C.slug; sessionStorage.removeItem('ilu-portal'); } catch (e) {}
  function revealHero(now) {
    var ht = document.getElementById('hero-text');
    var items = [].slice.call(ht.querySelectorAll('.mask-line, .rv'));
    items.forEach(function (el, i) { setTimeout(function () { el.classList.add('in'); }, now ? 0 : 250 + i * 180); });
  }
  if (!fromPortal) document.querySelector('.hero-img').animate([{ transform: 'scale(1.12)', opacity: .2 }, { transform: 'scale(1)', opacity: 1 }], { duration: 1400, easing: 'cubic-bezier(.2,.7,.2,1)' });
  revealHero(false);

  /* bar turns solid after the hero */
  var bar = document.getElementById('bar');
  addEventListener('scroll', function () { bar.classList.toggle('solid', scrollY > innerHeight * .6); }, { passive: true });

  /* golden dust */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, cv = document.getElementById('dust'), ctx = cv.getContext('2d'), W = 0, H = 0, P = [], last = 0;
  function size() { var d = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); P = []; for (var i = 0; i < (W < 700 ? 26 : 50); i++) P.push({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.6, vy: -(4 + Math.random() * 9), ph: Math.random() * 6.3, sp: .6 + Math.random() * 1.4 }); }
  function draw(t) { var dt = Math.min(.05, (t - (last || t)) / 1000); last = t; ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) { var p = P[i]; p.ph += dt * p.sp; p.y += p.vy * dt; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } ctx.fillStyle = 'rgba(242,214,158,' + (.25 + .6 * Math.abs(Math.sin(p.ph))) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    if (scrollY < innerHeight) requestAnimationFrame(draw); else { last = 0; waiting = true; } }
  var waiting = false;
  addEventListener('scroll', function () { if (waiting && scrollY < innerHeight && !reduce) { waiting = false; requestAnimationFrame(draw); } }, { passive: true });
  size(); addEventListener('resize', size); if (!reduce) requestAnimationFrame(draw);
  addEventListener('pageshow', function (e) { if (e.persisted) revealHero(true); });
})();
</script>
</body>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Ilusión · Bianca</title>
<meta name="robots" content="noindex">
<meta name="description" content="Tu evento en un solo lugar: pendientes mes por mes, invitados, mesas, proveedores y el plan del día.">
<meta name="theme-color" content="#FCF3F4" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap">
<style>
/* Agenda Ilusión (was "Mi Evento"): the client's event app. One base planner, themed per client (colors + event type), sections switched on per package. */
:root {
  --bg: #FCF3F4; --bg2: #F4DDE3; --ink: #4A2633; --accent: #B8798A;
  --card: color-mix(in srgb, var(--bg) 35%, #fff);
  --ink2: color-mix(in srgb, var(--ink) 74%, var(--bg)); --ink3: color-mix(in srgb, var(--ink) 52%, var(--bg));
  --line: color-mix(in srgb, var(--accent) 24%, transparent); --tint: color-mix(in srgb, var(--accent) 12%, transparent);
  --gold: #C4914D; --foil: linear-gradient(100deg, #9C7038 0%, #E2C489 30%, #B68A4E 55%, #E9CF95 78%, #A8783E 100%);
  --f-caps: "Cinzel", Georgia, serif; --f-serif: "Cormorant Garamond", Georgia, serif; --f-script: "Great Vibes", cursive; --f-body: "Jost", "Avenir Next", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 15.5px/1.5 var(--f-body); background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--bg) 60%, #fff), var(--bg) 55%, var(--bg2)) fixed; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* shell */
.app { min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 1px 0 var(--line); }
.top img { width: 34px; height: 34px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(60,35,20,.3)); }
.top .brand { display: flex; flex-direction: column; line-height: 1.1; }
.top .brand b { font: 600 10px var(--f-caps); letter-spacing: .3em; color: var(--gold); }
.top .brand span { font: 500 17px var(--f-serif); }
.top .days { margin-left: auto; display: none; padding: 5px 12px; border-radius: 999px; background: var(--tint); font: 500 12px var(--f-body); color: var(--ink2); white-space: nowrap; }
main { width: 100%; max-width: 780px; margin: 0 auto; padding: 18px 16px calc(var(--safe-b) + 150px); }
.side { display: none; }
.tabs { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(var(--safe-b) + 6px); background: color-mix(in srgb, var(--bg) 88%, #fff); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 -1px 0 var(--line), 0 -12px 30px -20px rgba(60,35,30,.35); }
.tabs a, .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; background: none; text-decoration: none; font-size: 10.5px; color: var(--ink3); border-radius: 14px; }
.tabs .on { color: var(--accent); font-weight: 600; }
.tabs .on svg { stroke-width: 2; }
.fab { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 11px; border: 0; border-radius: 999px; font: 600 12.5px var(--f-body); letter-spacing: .03em; color: #3A2210; background: linear-gradient(180deg, #F7E4B4, #EBC988 34%, #D6A963 70%, #C4914D); box-shadow: inset 0 0 0 1px rgba(170,120,55,.3), 0 12px 24px -10px rgba(140,95,40,.6); }
.fab svg { width: 18px; height: 18px; }
@media (min-width: 560px) { .top .days { display: inline-block; } .top .fab { margin-left: 0; } }
@media (max-width: 559px) { .top .fab { margin-left: auto; } }
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
  .top { grid-column: 1 / -1; }
  .side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px); overflow-y: auto; padding: 18px 12px; }
  .side a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; text-decoration: none; color: var(--ink2); font-size: 15px; }
  .side a:hover { background: var(--tint); }
  .side a.on { background: var(--card); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
  .side a.on svg { color: var(--accent); }
  .tabs { display: none; }
  main { padding-bottom: 100px; }
}

/* type + building blocks */
.eyebrow { display: block; font: 600 10.5px var(--f-caps); letter-spacing: .3em; color: var(--accent); }
.page-h { margin: 4px 2px 16px; }
.page-h h1 { margin: 2px 0 4px; font: 500 38px/1.05 var(--f-serif); }
.muted { color: var(--ink2); margin: 0; }
.small { font-size: 13px; color: var(--ink3); }
.card { position: relative; margin: 0 0 14px; padding: 18px; border-radius: 24px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 18px 34px -28px rgba(60,35,30,.5); }
.card h2 { margin: 2px 0 6px; font: 500 25px/1.15 var(--f-serif); }
.card h3 { margin: 2px 0 4px; font: 500 21px/1.2 var(--f-serif); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-t { margin: 22px 4px 10px; font: 600 11px var(--f-caps); letter-spacing: .28em; color: var(--ink3); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; text-decoration: none; font: 500 14px var(--f-body); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn-gold { color: #3A2210; font-weight: 600; background: linear-gradient(180deg, #F7E4B4, #EBC988 34%, #D6A963 70%, #C4914D); box-shadow: inset 0 0 0 1px rgba(170,120,55,.3), 0 10px 20px -12px rgba(140,95,40,.55); }
.btn-line { background: color-mix(in srgb, var(--card) 70%, #fff); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
.btn-del { color: #A23B3B; background: none; box-shadow: inset 0 0 0 1px rgba(162,59,59,.35); }
.add { width: 100%; justify-content: center; margin-top: 10px; background: none; box-shadow: inset 0 0 0 1.2px var(--line); border: 0; border-radius: 16px; min-height: 46px; color: var(--accent); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.add svg { width: 18px; height: 18px; }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font: 600 11px var(--f-body); white-space: nowrap; background: var(--tint); color: var(--ink2); }
.pill.si { background: #E3EFE3; color: #2E6B3C; }
.pill.no { background: #F3E2E2; color: #9A3B3B; }
.pill.pend { background: #F6EBD9; color: #8A6326; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 13px; background: color-mix(in srgb, var(--card) 60%, #fff); box-shadow: inset 0 0 0 1px var(--line); }
.chip button { border: 0; background: none; padding: 0 0 0 2px; color: var(--ink3); font-size: 16px; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.bar { height: 8px; border-radius: 99px; background: var(--tint); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--foil); transition: width .6s; }
.bar.over i { background: #C25B5B; }
.seg { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 14px; padding: 2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; padding: 8px 14px; border-radius: 999px; border: 0; background: color-mix(in srgb, var(--card) 60%, transparent); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.search { width: 100%; height: 46px; padding: 0 16px; margin-bottom: 12px; border-radius: 999px; border: 0; background: color-mix(in srgb, var(--card) 70%, #fff); box-shadow: inset 0 0 0 1px var(--line); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
.stat { padding: 14px 8px 12px; border-radius: 20px; text-align: center; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.stat b { display: block; font: 500 30px/1 var(--f-serif); }
.stat small { font-size: 12px; color: var(--ink3); }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .grow b { display: block; font-weight: 500; }
.row .grow small { display: block; font-size: 12.5px; color: var(--ink3); }
.tap { cursor: pointer; }
.ic-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--tint); color: var(--accent); text-decoration: none; flex: none; }
.ic-btn svg { width: 18px; height: 18px; }
.more { display: inline-block; margin-top: 10px; font-weight: 500; color: var(--accent); text-decoration: none; }
.empty { padding: 18px; text-align: center; color: var(--ink3); font-size: 14px; }

/* home */
.hero { position: relative; overflow: hidden; margin: 0 0 14px; padding: 26px 18px 20px; border-radius: 30px; text-align: center; background: radial-gradient(120% 90% at 50% 0%, #fff, var(--card) 60%); box-shadow: inset 0 0 0 1px var(--line), 0 26px 44px -30px rgba(60,35,30,.55); }
.hero::before { content: ""; position: absolute; inset: 8px; border-radius: 24px; border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); pointer-events: none; }
.hero-seal { width: 62px; height: 62px; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(60,35,20,.3)); }
.hero .script { margin: 0; padding: 0 .1em .05em; font: 400 clamp(46px, 13vw, 66px)/1.1 var(--f-script); background: linear-gradient(180deg, #D4A85E, #8E5F24); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-when { margin: 2px 0 14px; color: var(--ink2); font: italic 500 18px/1.35 var(--f-serif); }
.cd { display: flex; justify-content: center; gap: 10px; }
.cd div { min-width: 76px; padding: 10px 6px 8px; border-radius: 18px; background: color-mix(in srgb, var(--bg) 50%, #fff); box-shadow: inset 0 0 0 1px var(--line); }
.cd b { display: block; font: 500 34px/1 var(--f-serif); }
.cd small { font: 600 9px var(--f-caps); letter-spacing: .24em; color: var(--ink3); }
.cd-done { font: italic 500 22px var(--f-serif); }
.ring { --p: 0; flex: none; position: relative; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--tint) 0); }
.ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--card); }
.ring b { position: relative; font: 500 20px var(--f-serif); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 6px 12px; border-radius: 20px; text-decoration: none; font-size: 13px; text-align: center; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.tile svg { width: 26px; height: 26px; color: var(--accent); }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }

/* checklist */
.task .ck { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 0; display: grid; place-items: center; background: none; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); transition: background .3s; }
.task .ck svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
.task.done .ck { background: var(--gold); box-shadow: none; }
.task.done .ck svg { opacity: 1; }
.task .tx { flex: 1; min-width: 0; cursor: pointer; }
.task.done .tx { color: var(--ink3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--gold) 60%, transparent); }
.task .il { width: 20px; height: 20px; object-fit: contain; vertical-align: -5px; margin-right: 6px; filter: drop-shadow(0 1px 2px rgba(60,35,20,.3)); }
.stage.now { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 70%, transparent), 0 22px 40px -26px rgba(140,95,40,.5); }
.stage .when { display: flex; align-items: center; gap: 8px; }
.here { padding: 2px 9px; border-radius: 99px; font: 600 9.5px var(--f-caps); letter-spacing: .16em; color: #3A2210; background: linear-gradient(180deg, #F7E4B4, #D6A963); }

/* tables */
.mesas { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 620px) { .mesas { grid-template-columns: 1fr 1fr; } }
.mesa { margin: 0; }
.mesa-top { display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 10px; }
.tbl { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: italic 500 22px var(--f-serif); background: radial-gradient(circle at 35% 30%, #fff, var(--tint)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 55%, transparent); }
.mesa ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.mesa li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.mesa li small { color: var(--ink3); }
.mesa li button { margin-left: auto; border: 0; background: none; color: var(--ink3); font-size: 18px; line-height: 1; padding: 2px 6px; }
.sel { height: 38px; padding: 0 10px; border-radius: 12px; border: 0; background: color-mix(in srgb, var(--card) 70%, #fff); box-shadow: inset 0 0 0 1px var(--line); max-width: 46%; }

/* vendors / budget / day */
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 620px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2 .card { margin: 0; }
.money { font: 500 30px/1.1 var(--f-serif); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.kv div { padding: 12px; border-radius: 16px; background: color-mix(in srgb, var(--bg) 40%, #fff); box-shadow: inset 0 0 0 1px var(--line); }
.kv small { display: block; font-size: 12px; color: var(--ink3); }
.kv b { font: 500 22px var(--f-serif); }
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--foil); opacity: .7; }
.tl .row { position: relative; border-top: 0; padding: 10px 0; align-items: flex-start; }
.tl .row::before { content: ""; position: absolute; left: -23px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--gold); }
.tl .hr { flex: none; width: 64px; font: 500 20px/1.2 var(--f-serif); }
.sw { display: inline-block; width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), 0 4px 8px -4px rgba(0,0,0,.3); }

/* printables + videos */
.pieces { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 620px) { .pieces { grid-template-columns: repeat(3, 1fr); } }
.piece { margin: 0; padding: 12px; text-align: center; }
.pv { aspect-ratio: 5 / 7; margin-bottom: 10px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px; background: radial-gradient(120% 80% at 50% 0%, #fff, color-mix(in srgb, var(--bg) 70%, #fff)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 45%, transparent), inset 0 0 0 5px #fff, inset 0 0 0 6px color-mix(in srgb, var(--gold) 30%, transparent); }
.pv small { font: 600 7px var(--f-caps); letter-spacing: .22em; color: var(--ink3); }
.pv b { font: 400 26px/1.1 var(--f-script); background: linear-gradient(180deg, #D4A85E, #8E5F24); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .1em; }
.pv.ancho { aspect-ratio: 9 / 16; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 60%, #2a1a20), #241418); }
.pv.ancho.sq { aspect-ratio: 1; }
.pv.ancho small { color: #E9CF95; }
.pv.ancho b { background: linear-gradient(180deg, #F3D99A, #C79747); -webkit-background-clip: text; background-clip: text; }
.qr { width: 180px; margin: 6px auto 10px; padding: 10px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.qr svg { display: block; width: 100%; height: auto; }

/* sheet (forms and studio) */
.sheet-bg { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(30,18,22,.42); opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 10px 18px calc(var(--safe-b) + 20px); border-radius: 28px 28px 0 0; background: color-mix(in srgb, var(--bg) 50%, #fff); transform: translateY(30px); transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.sheet-bg.open .sheet { transform: none; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 28px; } }
.grab { width: 44px; height: 5px; margin: 0 auto 12px; border-radius: 99px; background: var(--line); }
.sheet h2 { margin: 0 0 12px; font: 500 28px var(--f-serif); }
.f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.f label { font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.f input, .f select, .f textarea { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 14px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; }
.f textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
.f input[type=color] { padding: 4px; height: 46px; }
.f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .btns { position: sticky; z-index: 3; bottom: -20px; padding: 12px 0 4px; background: color-mix(in srgb, var(--bg) 50%, #fff); }
.sheet .btns .btn { flex: 1; }
.note { padding: 10px 14px; margin-bottom: 14px; border-radius: 14px; font-size: 13px; color: var(--ink2); background: var(--tint); }
.sw-row { display: flex; flex-wrap: wrap; gap: 10px; }
.sw-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); position: relative; }
.sw-btn.on::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); }
.tog { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
.tog:first-child { border-top: 0; }
.tog > span:first-child { flex: 1; }
.tog small { display: block; color: var(--ink3); font-size: 12px; }
.sw-t { position: relative; width: 48px; height: 28px; flex: none; }
.sw-t input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw-t i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; }
.sw-t i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.sw-t input:checked + i { background: var(--gold); }
.sw-t input:checked + i::after { transform: translateX(20px); }
.sw-t input:disabled + i { opacity: .5; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--safe-b) + 140px); transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.install { display: none; }
.install.show { display: flex; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.pv-img { display: block; width: 100%; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 8px 18px -10px rgba(40,10,20,.55); }
</style>
</head>
<body>
<div class="app" id="app">

  stReset: function () { S = seed(S.cfg.tipo); save(); closeSheet(); location.hash = '#inicio'; render(); toast('Ejemplo restablecido'); }
};
function studio() {
  var c = S.cfg;
  openSheet('<h2>Personalizar</h2><p class="note">Así armamos la Agenda de cada cliente: con su evento, sus colores favoritos y las secciones de su paquete. ¡Pruébalo!</p>' +
    '<p class="sec-t" style="margin-top:0">EVENTO</p><div class="seg">' + [['xv', 'XV años'], ['boda', 'Boda']].map(function (o) { return '<button type="button" class="' + (c.tipo === o[0] ? 'on' : '') + '" data-a="stTipo" data-id="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +
    '<div class="f"><label for="s_n">' + (c.tipo === 'xv' ? 'Nombre de la quinceañera' : 'Nombres de los novios') + '</label><input id="s_n" data-ch="stF" data-id="nombre" value="' + esc(c.nombre) + '"></div>' +
    '<div><div class="f"><label for="s_f">Fecha y hora</label><input id="s_f" type="datetime-local" data-ch="stF" data-id="fecha" value="' + esc(c.fecha) + '"></div><div class="f"><label for="s_l">Lugar</label><input id="s_l" data-ch="stF" data-id="lugar" value="' + esc(c.lugar) + '"></div></div>' +
    '<p class="sec-t">COLORES DE SU EVENTO</p><div class="sw-row">' + Object.keys(TEMAS).map(function (k) { var t = TEMAS[k]; return '<button type="button" class="sw-btn' + (c.tema === k ? ' on' : '') + '" style="background:linear-gradient(135deg,' + t[1] + ' 0 45%,' + t[4] + ' 45%)" data-a="stTema" data-id="' + k + '" aria-label="' + t[0] + '" title="' + t[0] + '"></button>'; }).join('') +
    '<label class="sw-btn' + (c.tema === 'propio' ? ' on' : '') + '" style="background:conic-gradient(#e8a0b4,#e9cf95,#a9c7a0,#9bb3d9,#c3a6e0,#e8a0b4);display:grid;place-items:center;cursor:pointer" title="Su color"><input type="color" value="' + esc(c.propio || '#B8798A') + '" data-ch="stColor" style="opacity:0;width:100%;height:100%;cursor:pointer" aria-label="Elegir su color"></label></div>' +
    '<p class="sec-t">PAQUETE</p><div class="seg">' + [['ilusion', 'Ilusión'], ['gala', 'Gala'], ['experiencia', 'Experiencia']].map(function (o) { return '<button type="button" class="' + (c.paquete === o[0] ? 'on' : '') + '" data-a="stPaq" data-id="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +
    '<p class="small" style="margin:-6px 0 8px">El paquete enciende sus secciones. Si piden algo extra, enciéndelo aquí abajo.</p>' +
    '<div class="card" style="padding:6px 16px">' + MODS().map(function (m) { var fixed = m[0] === 'inicio'; return '<label class="tog"><span>' + m[1] + '<small>' + m[2] + '</small></span><span class="sw-t"><input type="checkbox" data-ch="stMod" data-id="' + m[0] + '"' + (on(m[0]) ? ' checked' : '') + (fixed ? ' disabled' : '') + '><i></i></span></label>'; }).join('') + '</div>' +
    '<div class="btns"><button class="btn btn-line" type="button" data-a="stReset">Restablecer ejemplo</button><button class="btn btn-gold" type="button" data-a="close">Listo</button></div>');
}
var CH = {
  mSet: function (id, el) { find(S.invitados, id).mesa = el.value; save(); render(); toast('Sentados ✓'); },
  stF: function (k, el) { if (!el.value) return; S.cfg[k] = el.value; save(); render(); },
  stColor: function (k, el) { S.cfg.tema = 'propio'; S.cfg.propio = el.value; save(); render(); studio(); },
  stMod: function (m, el) { var i = S.cfg.mods.indexOf(m); if (el.checked && i < 0) S.cfg.mods.push(m); if (!el.checked && i >= 0) S.cfg.mods.splice(i, 1); save(); render(); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (e.target === sheet) { closeSheet(); return; }
  if (!el) return;
  var keep = A[el.dataset.a] && A[el.dataset.a](el.dataset.id, el, e);
  if (el.tagName === 'A' && !keep && el.getAttribute('href') && el.getAttribute('href').charAt(0) !== '#') return;
  if (el.tagName === 'BUTTON' || (el.tagName !== 'A')) e.preventDefault();
});
document.addEventListener('change', function (e) { var el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el.dataset.id, el); });
document.addEventListener('input', function (e) { if (e.target.id === 'q') { UI.q = e.target.value; document.getElementById('glist').innerHTML = guestRows(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

/* ---------- render ---------- */
var last = '';
function route() { var r = location.hash.slice(1); return V[r] && on(r) ? r : 'inicio'; }
function render() {
  theme();
  var r = route(), M = MODS().filter(function (m) { return on(m[0]); });
  document.getElementById('view').innerHTML = V[r]();
  document.getElementById('topName').textContent = S.cfg.nombre;
  var d = dias(); document.getElementById('topDays').textContent = d > 0 ? 'Faltan ' + d + ' días' : d === 0 ? '¡Hoy!' : '✨';
  document.getElementById('side').innerHTML = M.map(function (m) { return '<a href="#' + m[0] + '" class="' + (m[0] === r ? 'on' : '') + '">' + ic(m[0]) + m[1] + '</a>'; }).join('');
  var pri = ['pendientes', 'invitados', 'mesas', 'dia', 'proveedores', 'presupuesto', 'videos', 'imprimibles', 'gracias'], tabs = ['inicio'];
  var rest = M.map(function (m) { return m[0]; }).filter(function (m) { return m !== 'inicio'; }).sort(function (a, b) { var x = pri.indexOf(a), y = pri.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
  var showMore = rest.length > 4; tabs = tabs.concat(rest.slice(0, showMore ? 3 : 4));
  var names = {}; M.forEach(function (m) { names[m[0]] = m[1]; });
  var tabsEl = document.getElementById('tabs');
  tabsEl.style.gridTemplateColumns = 'repeat(' + (tabs.length + (showMore ? 1 : 0)) + ', 1fr)';
  tabsEl.innerHTML = tabs.map(function (t) { return '<a href="#' + t + '" class="' + (t === r ? 'on' : '') + '">' + ic(t) + names[t] + '</a>'; }).join('') +
    (showMore ? '<button type="button" data-a="more" class="' + (tabs.indexOf(r) < 0 ? 'on' : '') + '">' + ic('mas') + 'Más</button>' : '');
  if (r !== last) { window.scrollTo(0, 0); if (r === 'pendientes') { var s = document.getElementById('st' + etapa()); if (s && etapa() > 0) setTimeout(function () { s.scrollIntoView({ block: 'start' }); scrollBy(0, -80); }, 50); } }
  last = r;
  var ins = document.getElementById('install'); if (ins && deferred) ins.classList.add('show');
}
addEventListener('hashchange', function () { closeSheet(); render(); });
setInterval(function () { var c = document.getElementById('cd'); if (c) c.innerHTML = cdHTML(); }, 30000);
// a client's app: "Personalizar" is only for our team (?equipo=1), and the guest list follows the live RSVPs
if (CL && !EQUIPO) { var fab = document.querySelector('.fab'); if (fab) fab.remove(); }
if (CL && CL.lista) {
  fetch('https://script.google.com/macros/s/AKfycbwLSkVg670lTXk73S5B_zP-ay8Kpwj7xFRDBXJPta3QF27T_Jy1zRBG3t_n2oZhiuc/exec', { method: 'POST', body: JSON.stringify({ lista: 1, evento: CL.lista.e, k: CL.lista.k }), credentials: 'omit' })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) return;
      (d.invitados || []).forEach(function (g) {
        var est = g.asiste === 'si' ? 'si' : g.asiste === 'no' ? 'no' : '';
        var mine = S.invitados.filter(function (x) { return x.code === g.c; })[0];
        if (!mine) { mine = { id: uid(), n: g.n, l: g.l, est: '', p: 0, mesa: '', tel: '', code: g.c }; S.invitados.push(mine); }
        mine.n = g.n; mine.l = g.l; mine.est = est; mine.p = est === 'si' ? (g.personas || g.l) : 0;
      });
      save(); render();
    }).catch(function () {});
}

/* install as an app */
var deferred = null;
addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; var ins = document.getElementById('install'); if (ins) ins.classList.add('show'); });
if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
render();
})();
</script>

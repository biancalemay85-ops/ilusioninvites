<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Álbum de la fiesta · Ilusión Invites</title>
<link rel="icon" href="../img/sello-rubor.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
/* The party album: every photo and video the guests sent with the QR. Opens with ?e=<evento>.<ver> (or the family key). */
:root{--bg:#FCF3F4;--bg2:#F6E4E7;--ac:#B8798A;--ac2:#E3BFC8;--ink:#4A2633;--soft:#7A5560;--card:#FFFDF9}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{min-height:100vh;background:radial-gradient(ellipse 90% 40% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:'Jost',system-ui,sans-serif}
header{text-align:center;padding:max(26px,env(safe-area-inset-top)) 16px 10px}
.seal{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(60,30,10,.18))}
.eyebrow{font:600 12px 'Cinzel',serif;letter-spacing:.32em;color:var(--ac);margin:8px 0 4px}
h1{font:italic 500 42px/1.05 'Cormorant Garamond',serif;margin:0 0 4px}
.sub{font:500 12px 'Cinzel',serif;letter-spacing:.2em;color:var(--soft);margin:0}
.count{font:400 14px 'Jost';color:var(--soft);margin:12px 0 0}
.up{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;background:var(--ac);color:#fff;text-decoration:none;font:500 15px 'Jost'}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:16px;max-width:1100px;margin:0 auto}
.grid button{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--bg2);cursor:zoom-in}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .vid{position:absolute;left:6px;bottom:6px;font:500 11px 'Jost';color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 6px}
.empty{text-align:center;color:var(--soft);padding:40px 16px;font:500 20px 'Cormorant Garamond',serif}
.lb{position:fixed;inset:0;z-index:9;background:rgba(30,10,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img,.lb iframe{max-width:100%;max-height:80vh;border:0;border-radius:10px}
.lb iframe{width:min(92vw,720px);aspect-ratio:9/16;max-height:80vh}
.lb .bar{display:flex;gap:10px}
.lb a,.lb button{border:0;border-radius:999px;padding:10px 18px;font:500 14px 'Jost';background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.foot{text-align:center;font:400 12px 'Jost';color:var(--soft);padding:10px 16px 40px}
</style>
</head>
<body>
<header>
  <img class="seal" src="../img/sello-rubor.webp" alt="">
  <p class="eyebrow">ÁLBUM DE LA FIESTA</p>
  <h1 id="nombre">&nbsp;</h1>
  <p class="sub" id="sub"></p>
  <p class="count" id="count">Cargando…</p>
  <a class="up" id="up" hidden>Subir mis fotos</a>
</header>
<main class="grid" id="grid"></main>
<p class="foot">Se actualiza solo · Hecho con ilusión · <a href="https://ilusioninvites.com/" style="color:inherit">Ilusión Invites</a></p>
<div class="lb" id="lb" hidden><div id="lbIn"></div><div class="bar"><a id="dl" target="_blank" rel="noopener">Descargar</a><button id="close" type="button">Cerrar</button></div></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwLSkVg670lTXk73S5B_zP-ay8Kpwj7xFRDBXJPta3QF27T_Jy1zRBG3t_n2oZhiuc/exec';
  var q = new URLSearchParams(location.search), raw = (q.get('e') || '').split('.'), EV = raw[0], VER = raw[1], K = q.get('k') || '', shown = 0;
  function $(id) { return document.getElementById(id); }
  if (q.get('subir')) { $('up').href = '../?e=' + EV + '.' + q.get('subir'); $('up').hidden = false; }
  function open(f) {
    var vid = f.tipo.indexOf('video') === 0;
    $('lbIn').innerHTML = vid ? '<iframe src="https://drive.google.com/file/d/' + f.id + '/preview" allow="autoplay"></iframe>' : '<img src="https://lh3.googleusercontent.com/d/' + f.id + '=w1800" alt="">';
    $('dl').href = 'https://drive.google.com/uc?export=download&id=' + f.id; $('lb').hidden = false;
  }
  $('close').onclick = function () { $('lb').hidden = true; $('lbIn').innerHTML = ''; };
  function load() {
    fetch(API, { method: 'POST', body: JSON.stringify({ album: 1, accion: 'ver', evento: EV, ver: VER, k: K }), credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { $('count').textContent = 'Este link no está completo. Pídelo de nuevo a la familia.'; return; }
      $('nombre').textContent = d.nombre; $('sub').textContent = d.sub || ''; document.title = 'Álbum · ' + d.nombre;
      var n = d.archivos.length;
      $('count').textContent = n ? n + (n === 1 ? ' foto o video' : ' fotos y videos') + ' de los invitados' : '';
      if (n === shown) return; shown = n;
      $('grid').innerHTML = '';
      if (!n) { $('grid').innerHTML = '<p class="empty" style="grid-column:1/-1">Aquí aparecerán las fotos que suban los invitados.</p>'; return; }
      d.archivos.forEach(function (f) {
        var b = document.createElement('button'); b.type = 'button';
        b.innerHTML = '<img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id=' + f.id + '&sz=w500">' + (f.tipo.indexOf('video') === 0 ? '<span class="vid">▶ video</span>' : '');
        b.onclick = function () { open(f); }; $('grid').appendChild(b);
      });
    }).catch(function () { $('count').textContent = 'Sin conexión. Inténtalo otra vez.'; });
  }
  load(); setInterval(function () { if (!document.hidden && $('lb').hidden) load(); }, 30000);
})();
</script>
</body>
</html>

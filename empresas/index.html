<style>
/* Corporate section (ilusioninvites.com/empresas/): same light brand as the home page, in Spanish, English and French.
   Every text lives in the T dictionary at the bottom (es, en, fr). Images come from the public site (/nuevo/img, /demos). */
:root {
  color-scheme: light;
  --ivory: #FBF6EF; --cream: #F4EBDF; --champagne: #E9D9C3; --navy: #22365A;
  --ink: #3A2A26; --ink2: #6E5B54; --ink3: #9A877F; --gold: #B68A4E; --gold-l: #E9CF95;
  --line: rgba(182,138,78,.28);
  --card: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,251,245,.55));
  --f-script: "Great Vibes", cursive; --f-caps: "Cinzel", "Trajan Pro", Georgia, serif; --f-serif: "Cormorant Garamond", Georgia, serif; --f-body: "Jost", "Avenir Next", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { margin: 0; background: var(--ivory); color: var(--ink); font: 400 16px/1.6 var(--f-body); overflow-x: hidden; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
em { font-style: italic; color: #9C7038; }

/* header (same look as the home page) */
.top { position: fixed; z-index: 40; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); background: rgba(251,246,239,.86); -webkit-backdrop-filter: blur(14px) saturate(1.15); backdrop-filter: blur(14px) saturate(1.15); box-shadow: 0 1px 0 rgba(182,138,78,.22), 0 12px 30px rgba(90,60,40,.06); }
.top .wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 22px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand img { width: 46px; height: auto; filter: drop-shadow(0 4px 6px rgba(90,60,30,.25)); }
.brand span { font: 500 10px var(--f-caps); letter-spacing: .34em; color: var(--gold); line-height: 1.3; }
.links { display: flex; justify-content: center; align-items: center; gap: clamp(16px, 2.6vw, 36px); }
.links a { position: relative; padding: 8px 0; text-decoration: none; color: var(--ink2); font: 500 11.5px var(--f-caps); letter-spacing: .24em; white-space: nowrap; }
.links a::after { content: ""; position: absolute; left: 50%; right: 50%; bottom: 3px; height: 1px; background: var(--gold); transition: left .4s ease, right .4s ease; }
.links a:hover { color: var(--ink); }
.links a:hover::after { left: 0; right: .24em; }
.actions { display: flex; align-items: center; gap: 12px; }
.lang { display: flex; border: 1px solid rgba(182,138,78,.45); border-radius: 999px; overflow: hidden; background: rgba(251,246,239,.6); }
.lang button { border: 0; background: none; padding: 7px 11px; font: 500 12.5px var(--f-body); color: var(--ink2); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--gold); color: #fff; }
@media (max-width: 900px) { .top .wrap { grid-template-columns: 1fr auto; } .links { grid-column: 1 / -1; grid-row: 2; gap: 20px; } .links a { font-size: 10.5px; letter-spacing: .18em; } .brand span { display: none; } }
@media (max-width: 600px) { .top .btn-sm { display: none; } .brand img { width: 40px; } .links { justify-content: space-between; gap: 6px; } .links a { font-size: 10px; letter-spacing: .12em; } .links .l-journey { display: none; } }

/* buttons (the site's epoxy style) */
.btn { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px; border-radius: 999px; font: 600 15px var(--f-body); letter-spacing: .04em; text-decoration: none; cursor: pointer; -webkit-font-smoothing: antialiased; transition: box-shadow .35s ease, transform .35s ease; text-align: center; }
.btn:hover { transform: translateY(-1px); }
.btn::before { content: ""; position: absolute; z-index: -1; left: 7%; right: 7%; top: 2px; height: 58%; border-radius: 999px; pointer-events: none; background: radial-gradient(ellipse 80% 100% at 50% 0%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 52%, rgba(255,255,255,0) 78%); }
.btn-gold { border: 0; color: #3A2210; background: linear-gradient(180deg, #F7E4B4 0%, #EBC988 34%, #D6A963 70%, #C4914D 100%); box-shadow: inset 0 0 0 1px rgba(170,120,55,.30), inset 0 -8px 16px rgba(160,105,40,.22), 0 10px 24px -12px rgba(140,95,40,.55), 0 0 20px rgba(236,204,140,.45); }
.btn-line { color: var(--ink); border: 1px solid rgba(182,138,78,.42); background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,250,242,.62)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px -12px rgba(120,85,45,.4); font-weight: 500; }
.btn-sm { min-height: 40px; padding: 0 18px; font-size: 13.5px; }

/* shared type */
.eyebrow { display: block; font: 500 12px var(--f-caps); letter-spacing: .36em; color: var(--gold); }
h1, h2, h3 { font-family: var(--f-serif); font-weight: 500; margin: 0; text-wrap: balance; }
h2 { font-size: clamp(32px, 4.4vw, 54px); line-height: 1.08; margin-top: 10px; }
.head { text-align: center; max-width: 760px; margin: 0 auto clamp(30px, 4vw, 52px); }
.head p { margin: 14px auto 0; color: var(--ink2); max-width: 60ch; }
.flour { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px auto 0; width: 160px; }
.flour i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.flour i:last-child { background: linear-gradient(90deg, var(--gold), transparent); }
.flour b { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); }
section { position: relative; padding-block: clamp(64px, 9vw, 120px); }

/* hero */
.hero { padding-top: calc(112px + env(safe-area-inset-top, 0px)); padding-bottom: clamp(56px, 7vw, 96px); background: #F3ECE2 url("/nuevo/img/marmol.webp?v=2") center / cover no-repeat; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 80% at 30% 45%, rgba(253,250,245,.92), rgba(253,250,245,.55) 60%, rgba(253,250,245,.15) 100%); }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(180deg, rgba(251,246,239,0), var(--ivory)); pointer-events: none; }
.hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(30px, 5vw, 70px); align-items: center; }
.hero h1 { font-size: clamp(40px, 5.4vw, 72px); line-height: 1.04; margin-top: 14px; }
.hero h1 em { display: block; }
.lead { margin: 20px 0 26px; max-width: 54ch; font-size: clamp(16px, 1.5vw, 18.5px); color: var(--ink2); }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.kinds { margin: 26px 0 0; font: 500 11px var(--f-caps); letter-spacing: .2em; color: var(--ink3); line-height: 2; }
.personal { display: inline-block; margin-top: 14px; font-size: 14px; color: var(--ink2); text-decoration: none; border-bottom: 1px solid rgba(182,138,78,.5); padding-bottom: 1px; }
.personal:hover { color: var(--ink); }
.visual { position: relative; justify-self: center; width: min(100%, 470px); aspect-ratio: 4 / 5; }
.arch { position: absolute; inset: 0 0 0 14%; border-radius: 999px 999px 26px 26px; overflow: hidden; padding: 9px; background: linear-gradient(140deg, #F3DFA9, #B68A4E 40%, #F3DFA9 60%, #9C7038); box-shadow: 0 40px 70px -40px rgba(60,35,15,.6); }
.arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; border-radius: 999px 999px 19px 19px; }
.phone { position: absolute; left: 0; bottom: -4%; width: 42%; aspect-ratio: 1 / 2; border-radius: 30px; padding: 7px; background: linear-gradient(145deg, #4a4044, #151213 40%, #2d2629 70%, #0f0d0e); box-shadow: 0 0 0 1.5px rgba(233,207,149,.8), 0 30px 50px -20px rgba(30,15,5,.7); }
.phone img { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
.chip { position: absolute; right: -2%; top: 16%; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 999px; background: rgba(255,252,246,.94); box-shadow: 0 14px 30px -14px rgba(60,35,15,.55), inset 0 0 0 1px rgba(182,138,78,.35); font-size: 13px; color: var(--ink); white-space: nowrap; }
.chip b { font: 600 22px/1 var(--f-serif); color: #9C7038; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: #3FA266; box-shadow: 0 0 0 4px rgba(63,162,102,.18); }
.chip2 { top: auto; bottom: 22%; right: -4%; }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .hero-txt { text-align: center; }
  .lead { margin-inline: auto; }
  .ctas { justify-content: center; }
  .visual { width: min(100%, 400px); margin-top: 8px; }
}
@media (max-width: 600px) {
  .hero { padding-top: calc(118px + env(safe-area-inset-top, 0px)); }
  .ctas .btn { width: 100%; }
  .visual { width: calc(100% - 20px); }
  .chip { right: -10px; font-size: 12px; padding: 8px 12px 8px 10px; }
  .chip b { font-size: 19px; }
}

/* why: business goals */
.goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.goal { position: relative; padding: 26px 24px 24px; border-radius: 24px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 20px 40px -30px rgba(90,60,30,.35); display: flex; flex-direction: column; gap: 8px; }
.goal .n { font: italic 500 30px/1 var(--f-serif); color: var(--gold); }
.goal h3 { font-size: 26px; line-height: 1.15; }
.goal p { margin: 0; color: var(--ink2); font-size: 15px; }
.goal .we { margin-top: auto; padding-top: 12px; font-size: 14.5px; color: var(--ink); }
.goal .we small { display: block; font: 500 10px var(--f-caps); letter-spacing: .26em; color: var(--gold); margin-bottom: 3px; }
@media (max-width: 960px) { .goals { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .goals { grid-template-columns: 1fr; } }

/* journey */
.journey { background: linear-gradient(180deg, var(--ivory), #F6EDE1 50%, var(--ivory)); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.step { border-radius: 26px; overflow: hidden; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line), 0 24px 50px -34px rgba(90,60,30,.45); }
.step .ph { aspect-ratio: 16 / 10; overflow: hidden; }
.step .ph img { width: 100%; height: 100%; object-fit: cover; }
.step .tx { padding: 22px 24px 26px; }
.step .k { font: 500 11px var(--f-caps); letter-spacing: .3em; color: var(--gold); }
.step h3 { font-size: 34px; line-height: 1.1; margin: 2px 0 10px; }
ul.dia { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
ul.dia li { position: relative; padding-left: 20px; font-size: 15px; line-height: 1.45; color: var(--ink2); }
ul.dia li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; } }

/* unique + report */
.uniq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px 40px; }
.uq { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: start; }
.uq .n { grid-row: span 2; font: italic 500 46px/0.9 var(--f-serif); background: linear-gradient(100deg, #9C7038 0%, #E9CF95 30%, #C29452 55%, #B68A4E 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 4px; }
.uq h3 { font-size: 25px; line-height: 1.15; }
.uq p { margin: 0; color: var(--ink2); font-size: 15px; }
@media (max-width: 960px) { .uniq { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .uniq { grid-template-columns: 1fr; gap: 26px; } }
.report { margin: clamp(50px, 7vw, 80px) auto 0; max-width: 860px; border-radius: 28px; padding: clamp(22px, 3.5vw, 36px); background: linear-gradient(160deg, #FFFDF9, #F6ECDF); box-shadow: inset 0 0 0 1px rgba(182,138,78,.38), 0 34px 60px -40px rgba(80,50,20,.55); }
.report .rh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 18px; }
.report .rh h3 { font-size: clamp(24px, 3vw, 32px); }
.report .rh span { font-size: 12.5px; color: var(--ink3); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { border-radius: 18px; padding: 16px 16px 14px; background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 1px rgba(182,138,78,.22); }
.stat b { display: block; font: 600 clamp(32px, 4vw, 42px)/1 var(--f-serif); color: var(--ink); }
.stat b small { font-size: .5em; color: var(--ink3); font-weight: 500; }
.stat span { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.35; color: var(--ink2); }
.report .more { display: inline-block; margin-top: 18px; font-size: 14.5px; color: #8A6232; text-decoration: none; border-bottom: 1px solid rgba(182,138,78,.5); }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* packages */
.packs { background: radial-gradient(ellipse 60% 50% at 50% 40%, #F6ECDF, rgba(246,236,223,0) 75%), var(--ivory); }
.pk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: stretch; }
.pk { position: relative; display: flex; flex-direction: column; padding: 30px 26px 26px; border-radius: 28px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 24px 50px -36px rgba(90,60,30,.45); }
.pk.feat { background: linear-gradient(180deg, #FFFDF8, #F8EEDF); box-shadow: inset 0 0 0 1.5px rgba(182,138,78,.7), 0 36px 60px -34px rgba(110,75,30,.55); }
.pk .badge { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); padding: 5px 16px; border-radius: 999px; font: 500 10.5px var(--f-caps); letter-spacing: .24em; color: #3A2210; background: linear-gradient(180deg, #F7E4B4, #D6A963); white-space: nowrap; box-shadow: 0 6px 14px -6px rgba(140,95,40,.6); }
.pk h3 { font-size: 34px; line-height: 1.05; text-align: center; }
.pk .tag { margin: 8px 0 0; text-align: center; color: var(--ink2); font-size: 15px; min-height: 3em; }
.pk .q { margin: 14px auto 18px; font: 500 11px var(--f-caps); letter-spacing: .26em; color: var(--gold); text-align: center; }
.pk ul.dia { margin-bottom: 24px; }
.pk .btn { margin-top: auto; width: 100%; }
@media (max-width: 960px) { .pk-grid { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; gap: 30px; } .pk .tag { min-height: 0; } }

/* partners */
.partner { overflow: hidden; }
.partner::before { content: ""; position: absolute; inset: 0; background: url("/nuevo/img/empresas-salon-ancho.webp") center / cover; opacity: .22; -webkit-mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent); }
.partner .box { position: relative; max-width: 1040px; margin: 0 auto; padding: clamp(28px, 5vw, 56px); border-radius: 32px; background: rgba(251,246,239,.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px rgba(182,138,78,.4), 0 40px 80px -50px rgba(60,35,15,.6); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 4px 0 28px; }
.opt { padding: 20px 20px 18px; border-radius: 20px; background: rgba(255,255,255,.75); box-shadow: inset 0 0 0 1px rgba(182,138,78,.25); }
.opt h3 { font-size: 24px; line-height: 1.15; margin-bottom: 6px; }
.opt p { margin: 0; font-size: 14.5px; color: var(--ink2); }
.partner .cta { text-align: center; }
@media (max-width: 860px) { .opts { grid-template-columns: 1fr; } }

/* demos */
.demos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(18px, 3vw, 36px) clamp(14px, 3vw, 30px); max-width: 980px; margin: 0 auto; }
.demo { text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.demo .scr { position: relative; width: min(100%, 230px); aspect-ratio: 1 / 2; border-radius: 30px; padding: 7px; background: linear-gradient(145deg, #4a4044, #151213 40%, #2d2629 70%, #0f0d0e); box-shadow: 0 0 0 1.5px rgba(233,207,149,.7), 0 26px 44px -26px rgba(40,20,5,.7); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.demo:hover .scr { transform: translateY(-6px); }
.demo .scr > img, .demo .scr > .mock { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
.demo .new { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; font: 500 10px var(--f-caps); letter-spacing: .22em; color: #3A2210; background: linear-gradient(180deg, #F7E4B4, #D6A963); white-space: nowrap; }
.demo .dn { font: 500 22px/1.15 var(--f-serif); color: var(--ink); }
.demo .ds { font-size: 13.5px; line-height: 1.35; color: var(--ink2); max-width: 26ch; }
.demo u { text-decoration: none; font: 500 10.5px var(--f-caps); letter-spacing: .22em; color: var(--gold); }
/* placeholder screens for the new demos */
.mock { overflow: hidden; display: flex; flex-direction: column; }
.mock.dash { background: linear-gradient(180deg, #FFFDF9, #F3E8DA); padding: 50px 12px 12px; gap: 8px; text-align: left; }
.mock.dash .t { font: 500 8.5px var(--f-caps); letter-spacing: .22em; color: var(--gold); }
.mock.dash .h { font: 600 17px/1.1 var(--f-serif); color: var(--ink); }
.mock.dash .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mock.dash .tiles div { border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px rgba(182,138,78,.25); padding: 8px 8px 6px; font-size: 9px; line-height: 1.2; color: var(--ink2); }
.mock.dash .tiles div b { display: block; font: 600 20px/1 var(--f-serif); color: var(--ink); }
.mock.dash .bar { height: 7px; border-radius: 99px; background: rgba(182,138,78,.18); overflow: hidden; }
.mock.dash .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #D6A963, #B68A4E); }
.mock.dash .row { display: flex; justify-content: space-between; font-size: 9px; color: var(--ink2); }
.mock.dash .lead-l { border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px rgba(182,138,78,.2); padding: 7px 8px; font-size: 9px; line-height: 1.5; color: var(--ink2); }
.mock.dash .lead-l b { color: var(--ink); font-weight: 500; }
.mock.lights { background: radial-gradient(circle at 20% 18%, rgba(255,214,140,.55) 0 2px, transparent 3px), radial-gradient(circle at 70% 12%, rgba(255,230,170,.6) 0 2px, transparent 3px), radial-gradient(circle at 84% 34%, rgba(255,205,120,.5) 0 3px, transparent 4px), radial-gradient(circle at 12% 46%, rgba(190,220,255,.5) 0 2px, transparent 3px), radial-gradient(circle at 60% 78%, rgba(255,214,140,.45) 0 3px, transparent 4px), radial-gradient(circle at 30% 88%, rgba(190,220,255,.45) 0 2px, transparent 3px), radial-gradient(ellipse at 50% 100%, #2B3E66, #101A33 60%, #0A1022); align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; }
.mock.lights img { width: 46%; height: auto; border-radius: 0; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
.mock.lights small { font: 500 8px var(--f-caps); letter-spacing: .3em; color: #E9CF95; }
.mock.lights em { font: 400 30px/1 var(--f-script); color: #F3DFA9; }
.mock.sea { background: linear-gradient(180deg, #E8EEF2 0%, #F7F3EA 55%, #EFE5D3 100%); align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; }
.mock.sea img { width: 52%; height: auto; border-radius: 0; filter: drop-shadow(0 8px 10px rgba(20,40,70,.3)); }

      L('fGuests') + ': ' + sel('f-guests'), L('fPk') + ': ' + sel('f-pk'),
      langs ? L('fLangs') + ': ' + langs : '', val('message') ? '\n' + val('message') : ''];
    return lines.filter(function (x) { return x !== ''; }).join('\n');
  }

    var m = message(); if (m) window.open('https://wa.me/16048391163?text=' + encodeURIComponent(m), '_blank', 'noopener');
